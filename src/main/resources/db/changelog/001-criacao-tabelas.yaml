
databaseChangeLog:
  - changeSet:
      id: 001-criacao-tabelas
      author: allan

      changes:
        - createTable:
            tableName: instrutor
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_instrutor
                    nullable: false

              - column:
                  name: nome
                  type: VARCHAR(120)
                  constraints:
                    nullable: false

              - column:
                  name: email
                  type: VARCHAR(160)
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: instrutor
            columnNames: email
            constraintName: uk_instrutor_email

        - createTable:
            tableName: curso
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_curso
                    nullable: false

              - column:
                  name: titulo
                  type: VARCHAR(150)
                  constraints:
                    nullable: false

              - column:
                  name: carga_horaria
                  type: INTEGER
                  constraints:
                    nullable: false

              - column:
                  name: nivel
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: instrutor_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: curso
            baseColumnNames: instrutor_id
            referencedTableName: instrutor
            referencedColumnNames: id
            constraintName: fk_curso_instrutor

      rollback:
        - dropTable:
            tableName: curso

        - dropTable:
            tableName: instrutor
